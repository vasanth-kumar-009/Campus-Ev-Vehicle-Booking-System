<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose your role | Campus EV Booking</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/style.css?v=roles4">
    <meta name="theme-color" content="#183c31">
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  </head>
  <body class="auth-page" data-session="user">
    <a class="skip" href="#content">Skip to content</a>
    <header class="top">
      <div class="top-inner">
        <a class="brand" href="index.html" aria-label="Campus EV home"><span class="brand-mark" aria-hidden="true"></span>Campus<span class="brand-ev">EV</span></a>
        <div class="user-tools"><button id="themeToggle" class="quiet small theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" title="Switch color theme"><span class="theme-moon" aria-hidden="true">☾</span><span class="theme-sun" aria-hidden="true">☀</span></button><a class="nav-link" href="index.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#ArrowLeft"></use></svg> Home</a></div>
      </div>
    </header>
    <main id="content" class="shell auth-shell">
      <div class="auth-card">
        <section class="auth-form">
          <h1>Choose your role</h1>
          <nav class="role-choices" aria-label="Choose a role to log in">
            <a class="role-choice" href="login.html?role=student">
              <span class="icon-box"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#GraduationCap"></use></svg></span>
              <span><strong>Student</strong><small>Book a ride with your student wallet.</small></span>
              <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#ArrowRight"></use></svg>
            </a>
            <a class="role-choice" href="login.html?role=staff">
              <span class="icon-box"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#Users"></use></svg></span>
              <span><strong>Staff</strong><small>Book a free staff ride.</small></span>
              <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#ArrowRight"></use></svg>
            </a>
            <a class="role-choice" href="login.html?role=driver">
              <span class="icon-box"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#BusFront"></use></svg></span>
              <span><strong>Driver</strong><small>See ride requests and manage your trips.</small></span>
              <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#ArrowRight"></use></svg>
            </a>
          </nav>
        </section>
        <aside class="auth-photo" aria-label="Campus shuttle">
          <img class="campus-photo" src="assets/campus-shuttle.webp" alt="Electric shuttle on a tree-lined campus avenue" width="1200" height="800">
          <div class="photo-sign"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#BusFront"></use></svg> Campus EV</div>
        </aside>
      </div>
    </main>
  </body>
</html>
