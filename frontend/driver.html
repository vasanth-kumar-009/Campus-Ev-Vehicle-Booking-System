<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard | Campus EV Booking</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/style.css?v=transit3">
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <script src="vendor/leaflet/leaflet.js"></script>
    <meta name="theme-color" content="#183c31">
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  </head>
  <body class="workspace-page" data-session="driver">
    <a class="skip" href="#content">Skip to content</a>
    <header class="top">
      <div class="top-inner">
        <a class="brand" href="index.html" aria-label="Campus EV home"><span class="brand-mark" aria-hidden="true"></span>Campus<span class="brand-ev">EV</span></a>
        <div class="user-tools">
          <button id="themeToggle" class="quiet small theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" title="Switch color theme"><span class="theme-moon" aria-hidden="true">☾</span><span class="theme-sun" aria-hidden="true">☀</span></button>
          <span class="who" id="whoami"></span>
          <button type="button" class="quiet small" id="logoutButton"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#LogOut"></use></svg>Log out</button>
        </div>
      </div>
    </header>
    <main id="content" class="shell dashboard">
      <div class="page-title">
        <p class="eyebrow">Driver portal</p>
        <h1>Driver dashboard</h1>
      </div>
      <div class="planner-grid">
        <div class="stack">
          <section class="panel">
            <h2 class="panel-heading"><span class="icon-box"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#BusFront"></use></svg></span>Driver availability</h2>
            <label for="vehicleSelect">Vehicle today</label>
            <select id="vehicleSelect"></select>
            <button id="toggleOnline" type="button">Go Online</button>
            <div id="driverStatus" class="status-box">Offline</div>
          </section>
          <section class="panel">
            <h2 class="panel-heading"><span class="icon-box"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#Bell"></use></svg></span>Incoming requests</h2>
            <div id="pendingList"></div>
          </section>
        </div>
        <section class="panel">
          <h2 class="panel-heading"><span class="icon-box"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#Map"></use></svg></span>Campus map</h2>
          <div id="map" class="map-box"></div>
        </section>
      </div>
      <div class="history-grid">
        <section class="panel">
          <h2 class="panel-heading"><span class="icon-box"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#Route"></use></svg></span>Rides in progress</h2>
          <div id="activeList"></div>
        </section>
        <section class="panel" id="unpaidPanel" hidden>
          <h2 class="panel-heading"><span class="icon-box"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#Wallet"></use></svg></span>Cash to collect</h2>
          <div id="unpaidList"></div>
        </section>
      </div>
      <details class="panel">
        <summary>Account settings</summary>
        <form id="deleteAccountForm">
          <h2>Delete my account</h2>
          <p>Deletion is permanent. Ride history is kept. Your vehicles will be available for reassignment.</p>
          <label for="deletePassword">Current password</label>
          <input id="deletePassword" type="password" autocomplete="current-password" required>
          <button type="submit">Delete my account</button>
          <p id="deleteMessage" role="status"></p>
        </form>
      </details>
    </main>
    <script src="js/app.js?v=3"></script>
    <script src="js/campus-config.js"></script>
    <script src="js/map.js"></script>
    <script src="js/geolocation.js"></script>
    <script src="js/driver.js"></script>
    <script src="js/account.js"></script>
  </body>
</html>
